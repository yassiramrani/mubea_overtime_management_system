name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: overtime_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: core.test_settings
      TEST_DB_ENGINE: postgresql
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: overtime_test
      DB_USER: postgres
      DB_PASSWORD: test-only
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DEBUG: 'True'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test overtimeapp --noinput
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv ../backend/venv && ../backend/venv/bin/pip install -r ../backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          SMOKE_OUTPUT: ${{ github.workspace }}/.verification/browser-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: .verification/browser-ci
